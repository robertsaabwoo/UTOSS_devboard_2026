# Single source of truth for the synthesis target.
#
# Every tool that needs to know what part we are building for reads this file:
# scripts/run_synth_check.py (yosys flags), the per-module resource budgets, and
# the CI summary. Change the part here, nowhere else.
#
# The board is a carrier for an AMD Kria K26 SOM (Zynq UltraScale+), developed
# first on a KV260. The ECP5 target this replaces is in archive/ecp5/rtl/.

device:
  part_number: XCK26 (Kria K26 SOM)
  family: Zynq UltraScale+ MPSoC
  dev_kit: KV260

  # Tool identifier. The CI gate is yosys `synth_xilinx`, which maps to real
  # UltraScale+ cells (LUT6, FDRE, RAMB36E2, DSP48E2) and so gives honest
  # per-module resource counts on a free GitHub runner. It is a proxy: Vivado
  # owns the real build, placement and timing (B1.5, B3.4).
  yosys_synth_command: synth_xilinx -family xcup

# Device capacity, for the ceiling check on the sum of all module budgets.
#
# CONFIDENCE: transcribed from the K26 data sheet (DS987) resource table, NOT
# verified line by line. Confirm before anyone makes an architectural decision
# on headroom -- see open_items/confirm-device-resources.
resources:
  luts: 117120
  ff: 234240
  bram18: 288          # 144 x 36 Kb blocks, counted as 18 Kb halves
  uram: 64             # 288 Kb UltraRAM blocks
  dsp: 1248            # DSP48E2

# Fraction of the fabric CI lets the sum of all module budgets reach before it
# fails. Lower than an ECP5 would need, because the PS-PL interconnect, AXI DMA
# and the SmartConnect fabric that Vivado adds are not in any bench's budget.
utilization_ceiling:
  luts: 0.70
  ff: 0.70
  bram18: 0.80
  uram: 0.80
  dsp: 0.90

# Clock domains the fabric design is expected to have. Benches read these names;
# keep RTL port names consistent with them.
clock_domains:
  - name: sys
    port: clk_sys
    reset: rst_sys_n
    target_mhz: 100
    notes: >
      PL clock from the PS (pl_clk0) and its processor-system reset. Drives the
      AXI DMA, the frame path and the compressor. The camera, DDR and storage
      are on the PS side, so there is no fabric pixel, DDR or SD clock.

open_items:
  - id: confirm-device-resources
    status: UNCONFIRMED
    question: >
      Confirm luts / ff / bram18 / uram / dsp for the K26 against DS987 before
      relying on the ceiling for an architectural decision.

  - id: compressor-clock
    status: OPEN
    question: >
      The CCSDS 123 core (SHyLoC or HLS, decided in B1.6) may need its own
      clock to meet the throughput in B1.2. If so, add the domain here.
