# Power submodule — supplies the FPGA core-board module and carrier peripherals.
block: power
owner_doc: null   # example project, not tied to initial_roles/*.md

nets:
  - name: VIN_12V
    type: input
    current_type: DC        # board itself is pure DC; mains AC->DC conversion
                             # happens in the external wall adapter, out of scope
    frequency_hz: null       # N/A — DC input
    nominal_v: 12.0
    min_v: 11.4
    max_v: 12.6
    tolerance_pct: 5
    notes: >
      Barrel jack (5.5x2.1mm, center-positive), standard wall adapter.
      Add reverse-polarity protection (ideal diode or P-MOSFET) and a
      resettable fuse (PTC) on this net — it's the board's single
      user-facing power entry point.

  - name: +5V
    type: rail
    current_type: DC
    frequency_hz: null
    switching_frequency_hz: null   # N/A for the CI behavioral model (see
                                    # spice/power/models.lib); a real switching
                                    # regulator will have Fsw ~300kHz-1.5MHz —
                                    # revisit ripple/EMI once a real part is picked
    nominal_v: 5.0
    min_v: 4.9
    max_v: 5.1
    tolerance_pct: 2
    min_current_a: 2.0    # QMTECH lists 1A@5V typical; budget headroom for
                           # a larger XC7A200T + any DDR3/user load on core board
    max_ripple_mv: 30
    notes: Feeds the FPGA core-board module's 5V input pin directly. See fpga.yaml.

  - name: +3V3
    type: rail
    current_type: DC
    frequency_hz: null
    switching_frequency_hz: null
    nominal_v: 3.3
    min_v: 3.2
    max_v: 3.4
    tolerance_pct: 3
    min_current_a: 0.5
    notes: >
      Powers carrier-side peripherals only (UART bridge IC, status LEDs).
      Generate locally on the carrier — do NOT tap the core board's onboard
      3.3V pin (if exposed), since it's sized for the FPGA's internal rails,
      not extra carrier load.

constraints:
  - single_continuous_ground_plane: true
  - star_ground_at_input_jack: true

# Declarative sweep axes for CI verification. Each axis is either a
# start/stop/step range or an explicit `values:` list (e.g. temperature
# corners) -- never both. `axes[].id` must match a {{id}} placeholder in
# `testbench_template`; adding a new axis (or a new sweep entirely) is a
# YAML + .cir.tmpl edit, no changes needed to scripts/run_power_sweep.py.
sweeps:
  - name: line_and_load
    testbench_template: spice/power/testbench.cir.tmpl
    axes:
      - id: vin
        description: 12V input line variation across VIN_12V's own spec tolerance
        start: 11.4
        stop: 12.6
        step: 0.4
      - id: rload5
        description: "+5V rail load sweep, full 3.0A load down to light 0.5A load"
        start: 1.667
        stop: 10.0
        step: 2.0
    assert_nets:
      - node: PLUS5V
        net: +5V
      - node: PLUS3V3
        net: +3V3

ci:
  schematic: hardware/devboard.kicad_sch
  spice_testbench: spice/power/testbench.cir.tmpl
  spice_model: spice/power/models.lib
  checker: scripts/run_power_sweep.py
