# Power submodule — supplies a bare Lattice ECP5 LFE5U-25F-7TG144C, a
# supervisor CPU, and the optical-payload camera interface.
#
# Power tree:
#
#   VIN_12V --buck--> +5V --+--buck--> +3V3_SYS   always on  (supervisor, housekeeping)
#                           |
#                           +--buck--> +3V3_FPGA  GATED      (FPGA VCCIO banks)
#                           +--ldo---> +2V5       GATED      (FPGA VCCAUX)
#                           +--buck--> +1V1       GATED      (FPGA VCC core)
#                           +--------> CAM_5V     GATED      (camera module, if 5V)
#
# The gated rails exist because the payload is duty-cycled: the imaging chain
# is off for most of the orbit. ECP5's ~125 mW static floor (see fpga.yaml
# ICC/ICCAUX) is only tolerable if it is not paid continuously, so the
# supervisor cuts the FPGA rails entirely between captures. That is the single
# largest power lever in this design -- larger than any I/O-voltage choice.
block: power
owner_doc: null

nets:
  - name: VIN_12V
    type: input
    current_type: DC
    frequency_hz: null
    nominal_v: 12.0
    min_v: 11.4
    max_v: 12.6
    tolerance_pct: 5
    domain: always_on
    notes: >
      Barrel jack (5.5x2.1mm, center-positive), bench supply. Reverse-polarity
      protection (ideal diode or P-MOSFET) and a resettable fuse (PTC) required.
      GROUND-SUPPORT ONLY: a flight build draws from the spacecraft bus, not a
      barrel jack. The tree below is deliberately structured so only this front
      end changes -- everything from +5V down is bus-agnostic.
      See open_items/flight-input-bus.

  - name: +5V
    type: rail
    current_type: DC
    nominal_v: 5.0
    min_v: 4.9
    max_v: 5.1
    tolerance_pct: 2
    domain: always_on
    converted_from: VIN_12V
    converter:
      topology: buck
      efficiency_pct: 90
      quiescent_ma: 0.5
    soft_start_ms: 2.0
    enable_delay_ms: 0.0
    max_ripple_mv: 30
    notes: Intermediate rail. Every downstream converter hangs off this node.

  - name: +3V3_SYS
    type: rail
    current_type: DC
    nominal_v: 3.3
    min_v: 3.2
    max_v: 3.4
    tolerance_pct: 3
    domain: always_on
    converted_from: +5V
    converter:
      topology: buck
      efficiency_pct: 88
      quiescent_ma: 0.02
    soft_start_ms: 2.0
    enable_delay_ms: 1.0
    notes: >
      Supervisor CPU and housekeeping only. Deliberately SEPARATE from
      +3V3_FPGA even though both are 3.3V: the supervisor must stay alive while
      the FPGA is powered down, so they cannot share a rail. Anything the
      supervisor drives toward the FPGA crosses a power-domain boundary --
      see supervisor.yaml and the domain-crossing check in
      scripts/check_logic_spec.py.

  - name: +3V3_FPGA
    type: rail
    current_type: DC
    nominal_v: 3.3
    min_v: 3.2
    max_v: 3.4
    tolerance_pct: 3
    domain: gated
    gate_control: supervisor.FPGA_PWR_EN
    converted_from: +5V
    converter:
      topology: buck
      efficiency_pct: 90
      quiescent_ma: 0.02
    soft_start_ms: 2.0
    enable_delay_ms: 3.0
    notes: >
      FPGA VCCIO banks. min_v/max_v (3.2-3.4V) sits inside the LVCMOS33 VCCIO
      window of 3.135-3.465V (ECP5 datasheet Table 3.11), which is what makes
      the LVCMOS33 edges in camera.yaml/supervisor.yaml/uart_io.yaml legal.
      Brought up FIRST among the gated rails -- it feeds VCCIO8, which gates
      Power-On-Reset release. See rail_rules.sequence.

  - name: +2V5
    type: rail
    current_type: DC
    nominal_v: 2.5
    min_v: 2.45
    max_v: 2.55
    tolerance_pct: 2
    domain: gated
    gate_control: supervisor.FPGA_PWR_EN
    converted_from: +5V
    converter:
      topology: ldo
      efficiency_pct: 50   # LDO efficiency is Vout/Vin = 2.5/5.0
      quiescent_ma: 0.05
    soft_start_ms: 2.0
    enable_delay_ms: 6.0
    notes: >
      FPGA VCCAUX. Must land inside 2.375-2.625V (ECP5 Table 3.2).
      LDO rather than buck ON PURPOSE despite the 50% efficiency: VCCAUX powers
      the PLLs and the differential input comparators, and at ~25 mA the
      absolute waste is ~62 mW while switching noise here would land directly
      on the DCMI capture clock. Revisit only if the budget gets tight.

  - name: +1V1
    type: rail
    current_type: DC
    nominal_v: 1.1
    min_v: 1.07
    max_v: 1.13
    tolerance_pct: 3
    domain: gated
    gate_control: supervisor.FPGA_PWR_EN
    converted_from: +5V
    converter:
      topology: buck
      efficiency_pct: 85
      quiescent_ma: 0.02
    soft_start_ms: 2.0
    enable_delay_ms: 6.0
    notes: >
      FPGA VCC core. Must land inside 1.045-1.155V (ECP5 Table 3.2).
      MUST be a buck, not an LDO: at 250 mA a 5V->1.1V LDO would burn
      ~975 mW as heat to deliver 275 mW. That single choice is worth more
      than every other efficiency decision on this board combined.

  - name: CAM_5V
    type: rail
    current_type: DC
    nominal_v: 5.0
    min_v: 4.9
    max_v: 5.1
    domain: gated
    gate_control: supervisor.FPGA_PWR_EN
    converted_from: +5V
    converter:
      topology: passthrough
      efficiency_pct: 100
      quiescent_ma: 0.0
    soft_start_ms: 2.0
    enable_delay_ms: 3.0
    notes: >
      Switched pass-through of +5V for the camera module. PLACEHOLDER --
      the OEM camera's supply voltage and current are not yet known.
      See open_items/camera-part-selection.

# ---------------------------------------------------------------------------
# Rail bring-up rules, transcribed from the ECP5 datasheet. Enforced by
# scripts/check_power_rules.py against each rail's soft_start_ms /
# enable_delay_ms, assuming a linear monotonic ramp from 0 to nominal_v.
# ---------------------------------------------------------------------------
rail_rules:
  ramp_rate_v_per_ms:
    min: 0.01
    max: 10.0
    applies_to_domain_of: fpga
    source: "ECP5 FPGA-DS-02012 Table 3.3 (tRAMP, all supplies, monotonic)"

  # Table 3.2 note 4: VCCAUX must not exceed 30 mV/us == 30 V/ms while
  # transitioning between 0V and 3V. Recorded for traceability even though the
  # global 10 V/ms limit above is stricter -- the checker enforces the tighter
  # of the two, so this stays correct if the global limit is ever revisited.
  per_rail_ramp_max_v_per_ms:
    "+2V5": 30.0

  sequence:
    - name: vccio8-before-core
      before: {rail: "+3V3_FPGA", reaches_v: 1.06}
      after: {rail: "+1V1", reaches_v: 1.00}
      min_margin_ms: 1.0
      reason: >
        VCCIO8 (bank 8, on +3V3_FPGA) is one of the three supplies monitored
        for Power-On-Reset release, and it is the only VCCIO with ramp-up trip
        detection (ECP5 Table 3.4 / section 3.5). Bringing it up before VCC
        reaches its POR trip point keeps the configuration and JTAG pins in a
        defined state through bring-up, so the supervisor never sees a floating
        PROGRAMN/INITN/DONE. Thresholds are the worst-case (max) trip points:
        VCCIO8 1.06V, VCC 1.00V.

    - name: vccio8-before-vccaux
      before: {rail: "+3V3_FPGA", reaches_v: 1.06}
      after: {rail: "+2V5", reaches_v: 2.20}
      min_margin_ms: 1.0
      reason: >
        Same POR rule, VCCAUX side. Worst-case VCCAUX ramp-up trip is 2.20V
        (ECP5 Table 3.4).

# ---------------------------------------------------------------------------
# Power budget. Currents are per-state; scripts/check_power_rules.py walks each
# rail up its converted_from chain, applies converter efficiency and quiescent
# current, and asserts the total draw at input_rail stays under
# max_input_power_mw.
#
# `static_ma` MUST be a datasheet/measured figure with a cited source.
# `dynamic_allowance_ma` is a DESIGN CEILING we are choosing, not a measured
# value -- it is the number the implementation is required to come in under.
# ---------------------------------------------------------------------------
power_budget:
  input_rail: VIN_12V
  states:
    - name: payload_active
      description: Imaging in progress — camera streaming DCMI, FPGA compressing.
      max_input_power_mw: 2500
      rails_off: []
      loads:
        - rail: "+1V1"
          consumer: fpga.VCC
          static_ma: 77
          dynamic_allowance_ma: 173
          source: "ECP5 Table 3.8 ICC typ, LFE5U-25F, TJ=85C, 0 Hz"
          note: >
            Static 77 mA is the tri-stated 0 Hz floor. The 173 mA dynamic
            allowance is a budget we are imposing on the compression core, not
            a datasheet number — confirm with the Lattice Power Calculator once
            the design has a real clock rate and toggle rate.
        - rail: "+2V5"
          consumer: fpga.VCCAUX
          static_ma: 16
          dynamic_allowance_ma: 9
          source: "ECP5 Table 3.8 ICCAUX typ, LFE5U-25F"
        - rail: "+3V3_FPGA"
          consumer: fpga.VCCIO
          static_ma: 4
          dynamic_allowance_ma: 46
          source: "ECP5 Table 3.8 ICCIO 0.5 mA/bank typ x 7 banks, rounded up"
          note: >
            The 46 mA dynamic allowance covers DCMI bus switching. This scales
            directly with VCCIO voltage and bus toggle rate, so it is the one
            place where picking a lower bank voltage buys real power back.
        - rail: "+3V3_SYS"
          consumer: supervisor.VDD
          static_ma: 30
          dynamic_allowance_ma: 20
          note: PLACEHOLDER — no supervisor part selected yet.
        - rail: CAM_5V
          consumer: camera.VDD
          static_ma: 0
          dynamic_allowance_ma: 200
          note: PLACEHOLDER — see open_items/camera-part-selection.

    - name: payload_idle
      description: >
        Supervisor awake, FPGA and camera fully unpowered. This is the state
        the payload spends most of the orbit in, so this number — not the
        active number — dominates orbit-average energy.
      max_input_power_mw: 350
      rails_off: ["+1V1", "+2V5", "+3V3_FPGA", CAM_5V]
      loads:
        - rail: "+3V3_SYS"
          consumer: supervisor.VDD
          static_ma: 30
          dynamic_allowance_ma: 20
          note: PLACEHOLDER — no supervisor part selected yet.

open_items:
  - id: flight-input-bus
    status: UNCONFIRMED
    question: >
      What does the spacecraft bus actually deliver to this payload — voltage,
      tolerance, and whether it is switched upstream? VIN_12V is a bench
      barrel jack. Everything from +5V down should survive the swap unchanged,
      but the 12V->5V stage will be replaced and the budget's input_rail with it.

  - id: camera-part-selection
    status: UNCONFIRMED
    question: >
      Which OEM camera? Needed before any of the following can be real:
      CAM_5V voltage and current, the DCMI bus I/O voltage (which sets VCCIO on
      the capture bank), DCMI data width and sync polarity, and the UART
      control levels. Every camera.yaml PLACEHOLDER traces back to this.

  - id: frame-buffer-memory
    status: UNCONFIRMED
    question: >
      LFE5U-25F has 1,032,192 bits (~126 KB) of block RAM — far less than one
      frame from any imaging sensor worth flying. Compression therefore either
      streams line-by-line with a small window (fits on-chip, constrains the
      algorithm) or needs external memory (HyperRAM is ~11 pins and low power;
      DDR3 is ~50 pins and would strain a 98-I/O TQFP-144). This decision
      changes the pinout, the power budget, and the RTL architecture, so it
      should be settled before layout.

  - id: supervisor-part-selection
    status: UNCONFIRMED
    question: >
      Which supervisor CPU? Sets +3V3_SYS current, the FPGA-facing I/O voltage,
      and whether it can hold its config pins tri-stated while +3V3_FPGA is off
      (see supervisor.yaml domain-crossing constraint).

constraints:
  - single_continuous_ground_plane: true
  - star_ground_at_input_jack: true
  - core_rail_must_be_switching: >
      +1V1 must be a buck converter. An LDO on this rail wastes ~975 mW at the
      budgeted 250 mA and would dominate the entire board's power.
  - gated_rails_switch_together: >
      +1V1, +2V5, +3V3_FPGA and CAM_5V are all controlled by
      supervisor.FPGA_PWR_EN. Leaving VCCIO powered while VCC is off puts the
      FPGA in the hot-socket leakage regime (ECP5 Table 3.5: up to 18 mA per
      pin when VCCIO <= VIN <= VCCIO+0.5V), which defeats the point of gating.

# Declarative sweep axes for CI verification. Each axis is either a
# start/stop/step range or an explicit `values:` list (e.g. temperature
# corners) -- never both. `axes[].id` must match a {{id}} placeholder in
# `testbench_template`; adding a new axis (or a new sweep entirely) is a
# YAML + .cir.tmpl edit, no changes needed to scripts/run_power_sweep.py.
#
# SPICE verifies regulation (does the rail stay in its min_v/max_v window
# under load and line variation). It does NOT verify efficiency or energy --
# that is scripts/check_power_rules.py's job, working from the budget above.
sweeps:
  - name: line_and_load
    testbench_template: spice/power/testbench.cir.tmpl
    axes:
      - id: vin
        description: 12V input line variation across VIN_12V's own spec tolerance
        start: 11.4
        stop: 12.6
        step: 0.4
      - id: rload_core
        description: >
          +1V1 core load, from the 250 mA budgeted worst case (4.4 ohm) out to
          the 77 mA static-only floor (14.3 ohm). Light load matters here: a
          duty-cycled payload spends real time near the static floor, which is
          exactly where a switching regulator's PFM/PWM transition lives.
        values: [4.4, 6.0, 9.0, 14.3]
    assert_nets:
      - node: PLUS5V
        net: "+5V"
      - node: PLUS3V3S
        net: "+3V3_SYS"
      - node: PLUS3V3F
        net: "+3V3_FPGA"
      - node: PLUS2V5
        net: "+2V5"
      - node: PLUS1V1
        net: "+1V1"

ci:
  schematic: hardware/devboard.kicad_sch
  spice_testbench: spice/power/testbench.cir.tmpl
  spice_model: spice/power/models.lib
  checker: scripts/run_power_sweep.py
  rules_checker: scripts/check_power_rules.py
