# UART I/O submodule — USB-to-UART bridge for the FPGA debug console.
#
# GROUND SUPPORT ONLY. This is a bench convenience for bring-up and would be
# depopulated (or omitted) on a flight build. It is powered from the always-on
# +3V3_SYS rail so it stays enumerated on the host PC while the FPGA is
# power-gated off — which means every signal between it and the FPGA crosses a
# power-domain boundary.
block: uart_io
owner_doc: null

nets:
  - name: BRIDGE_3V3
    type: rail
    source: power.+3V3_SYS
    nominal_v: 3.3
    min_v: 3.135   # bridge IC's accepted 3.3V input tolerance (typical USB-UART bridge datasheet)
    max_v: 3.465
    domain: always_on

  - name: UART_FPGA
    type: logic
    source: fpga.CONSOLE_TX
    domain: always_on
    logic_level_v: 3.3
    standard: LVCMOS33
    electrical:
      role: receiver
      require:
        vih_min_v: 2.0      # LVCMOS33 guaranteed input-high threshold
        vil_max_v: 0.8
      absolute_max_v: 3.6   # bridge IC's own absolute max input rating
      isolation: series_resistor_and_bridge_tx_disable
    notes: >
      Bridge IC must be a 3.3V-native I/O variant (e.g. FTDI FT232RL,
      Silicon Labs CP2102N in 3.3V mode) so it connects directly to the
      FPGA bank (see fpga.yaml VCCIO_CAM) with no external level shifter.

      DOMAIN CROSSING: the bridge sits on always-on +3V3_SYS, the FPGA console
      pins on gated +3V3_FPGA. The bridge's TX line into a powered-down FPGA
      back-powers VCCIO through the ESD clamp. A series resistor (typ. 1k) on
      each direction bounds that current to a level the clamp tolerates and is
      the cheapest fix here — a UART at kilobaud does not care about the added
      RC. Sizing must be checked against ECP5's hot-socket limit
      (FPGA-DS-02012 Table 3.5, IDK 1 mA for top/bottom banks).

interfaces:
  - name: USB
    connector: USB-C (or Micro-B)
    notes: User-facing connector to host PC — highest ESD exposure on the board.
  - name: UART
    signals:
      TXD: "bridge TXD -> FPGA RXD pin"
      RXD: "bridge RXD <- FPGA TXD pin (crossed)"
    baud_note: Flow control (RTS/CTS) optional; TX/RX-only sufficient for console.

constraints:
  - esd_protection: "TVS diode array required on USB D+/D- lines."
  - shared_ground: "Common ground plane with power, fpga and supervisor submodules — no isolated/split ground."
  - no_usb_backfeed: >
      Do not power +3V3_SYS from USB VBUS. A bench USB cable would then be an
      uncontrolled second power source competing with the 12V input.

open_items:
  - id: series-resistor-value
    status: UNCONFIRMED
    question: >
      Confirm the series resistor value on the bridge<->FPGA lines against the
      bridge's output drive and ECP5's hot-socket leakage limit, rather than
      defaulting to 1k because it is a round number.

ci:
  logic_checker: scripts/check_logic_spec.py
