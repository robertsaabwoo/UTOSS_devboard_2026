name: kicad-ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      power: ${{ steps.filter.outputs.power }}
      fpga: ${{ steps.filter.outputs.fpga }}
      uart_io: ${{ steps.filter.outputs.uart_io }}
      camera: ${{ steps.filter.outputs.camera }}
      supervisor: ${{ steps.filter.outputs.supervisor }}
      run_all: ${{ steps.gate.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter needs history to diff against base/before

      - name: Determine if this is a full-board gate (PR into main, or push to main)
        id: gate
        # Context values go through env, not direct ${{ }} interpolation into the
        # script body -- a branch name containing shell metacharacters would
        # otherwise be executed here.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          if { [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; } \
             || [ "$REF" = "refs/heads/main" ]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      # No explicit `base:` -- the action then diffs against the repository
      # default branch (main). Diffing against github.event.before instead
      # would only see the most recent push, so a module changed in an earlier
      # commit on the same branch would stop being re-checked on later pushes.
      # It also breaks on a branch's first push, where `before` is the null SHA.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            power:
              - 'hardware/devboard.kicad_sch'
              - 'io_specs/power.yaml'
              - 'spice/power/**'
              - 'scripts/run_power_sweep.py'
              - 'scripts/check_power_rules.py'
            # check_logic_spec.py walks the whole cross-module graph, so any
            # io_specs change can flip a logic result for any module -- these
            # filters watch io_specs/** rather than just their own spec file.
            # RTL lives in its own workflow (.github/workflows/rtl-ci.yml) --
            # this filter is only about the schematic and the io_specs graph.
            fpga:
              - 'hardware/devboard.kicad_sch'
              - 'io_specs/**'
              - 'scripts/check_logic_spec.py'
            uart_io:
              - 'hardware/devboard.kicad_sch'
              - 'io_specs/**'
              - 'scripts/check_logic_spec.py'
            camera:
              - 'hardware/devboard.kicad_sch'
              - 'io_specs/**'
              - 'scripts/check_logic_spec.py'
            supervisor:
              - 'hardware/devboard.kicad_sch'
              - 'io_specs/**'
              - 'scripts/check_logic_spec.py'

  power-erc:
    name: "power / Schematic ERC"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.power == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run twice on purpose: capture every severity for the artifact first, so
      # the report still uploads when the gate below fails.
      - name: Generate ERC report (all severities)
        run: |
          mkdir -p erc_out
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:9.0 \
            kicad-cli sch erc --format json --severity-all \
              hardware/devboard.kicad_sch --output erc_out/erc.json

      - name: Upload ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-report
          path: erc_out/erc.json
          if-no-files-found: warn

      # THE GATE. `kicad-cli sch erc` exits 0 even when violations exist unless
      # --exit-code-violations is passed, so without this flag the job above
      # can never fail and the check is decorative.
      - name: Fail on ERC errors
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            kicad/kicad:9.0 \
            kicad-cli sch erc --format json --severity-error --exit-code-violations \
              hardware/devboard.kicad_sch --output erc_out/erc_errors.json

  power-spice:
    name: "power / SPICE sweep verification"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.power == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Install Python deps
        run: pip install pyyaml

      - name: Run power rail sweeps against io_specs/power.yaml
        run: python3 scripts/run_power_sweep.py

  # Energy and bring-up timing. Deliberately separate from power-spice: an
  # operating-point sweep can prove a rail regulates and still say nothing
  # about how much the board draws or whether the rails come up in the order
  # the FPGA requires.
  power-rules:
    name: "power / Power budget & bring-up rules"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.power == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml

      - name: Check power budget, ramp rates and bring-up sequencing
        run: python3 scripts/check_power_rules.py

  fpga-logic:
    name: "fpga / Logic-level cross-check"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.fpga == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml

      - name: Check fpga electrical/logic-level cross-references
        run: python3 scripts/check_logic_spec.py --module fpga

  uart_io-logic:
    name: "uart_io / Logic-level cross-check"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.uart_io == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml

      - name: Check uart_io electrical/logic-level cross-references
        run: python3 scripts/check_logic_spec.py --module uart_io

  camera-logic:
    name: "camera / Logic-level cross-check"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.camera == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml

      - name: Check camera electrical/logic-level cross-references
        run: python3 scripts/check_logic_spec.py --module camera

  supervisor-logic:
    name: "supervisor / Logic-level cross-check"
    needs: changes
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.supervisor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml

      - name: Check supervisor electrical/logic-level cross-references
        run: python3 scripts/check_logic_spec.py --module supervisor
